name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versión desde la etiqueta
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "__version__ = \"$V\"" > desktop/core/version.py
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt pyinstaller==6.11.1
      - name: Compilar
        run: pyinstaller --noconfirm --windowed --name WESKER --add-data "desktop/app_config.json;." desktop/main.py
      - name: Prueba de humo (el .exe abre y la ventana sigue viva)
        timeout-minutes: 2
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:WESKER_SMOKETEST = "1"
          $p = Start-Process -FilePath "dist\WESKER\WESKER.exe" -Wait -PassThru
          $log = Join-Path $env:APPDATA "WESKER\crash.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { Write-Host "El ejecutable falló con código $($p.ExitCode)"; exit 1 }
      - name: Instalador
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" installer\wesker.iss
      - name: Firma SHA-256
        run: (Get-FileHash dist_installer\WESKER-Setup.exe -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -Encoding ascii dist_installer\WESKER-Setup.exe.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/WESKER-Setup.exe
            dist_installer/WESKER-Setup.exe.sha256